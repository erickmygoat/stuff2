<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <title>My Son</title>
    <style>
        /* S21 Ultra Optimization: Pure Black OLED Theme */
        :root {
            --bg-color: #000000;
            --surface: #121212;
            --primary: #00ff41; /* Cyber Green */
            --secondary: #008f11;
            --text: #e0e0e0;
            --dim: #666;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* Header */
        header {
            padding: 15px;
            background: rgba(18, 18, 18, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; color: var(--primary); text-transform: uppercase; }
        .status { font-size: 0.7rem; color: var(--dim); display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .dot.online { background: var(--primary); box-shadow: 0 0 5px var(--primary); }

        /* Chat Area */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user {
            align-self: flex-end;
            background: #2a2a2a;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .agent {
            align-self: flex-start;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #ccc;
            border-bottom-left-radius: 4px;
        }
        .agent strong { color: var(--primary); display: block; margin-bottom: 5px; font-size: 0.8rem; }

        /* Input Area */
        .input-bar {
            padding: 10px 15px;
            background: var(--surface);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid #333;
        }
        input {
            flex: 1;
            background: #222;
            border: none;
            padding: 12px;
            border-radius: 20px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input:focus { background: #2a2a2a; }

        button {
            background: var(--secondary);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { transform: scale(0.95); }
        button.mic.recording { background: #ff4444; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0); } }

        /* Icons */
        .icon { width: 20px; height: 20px; fill: currentColor; }

    </style>
</head>
<body>
    <header>
        <div>
            <h1>My Son</h1>
            <div class="status"><div id="status-dot" class="dot"></div> <span id="status-text">Connecting...</span></div>
        </div>
        <div id="vitals" style="font-size:0.7rem; text-align:right; color:#555;">
            CPU: <span id="cpu">0%</span><br>MEM: <span id="mem">0%</span>
        </div>
    </header>

    <div id="chat-window">
        <div class="message agent">
            <strong>SYSTEM</strong>
            Mobile Interface Initialized. Secure Uplink Established.
        </div>
    </div>

    <div class="input-bar">
        <button id="mic-btn" class="mic" onclick="toggleVoice()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
        <button id="send-btn" onclick="sendMessage()">
            <svg class="icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
        const token = "1234"; // Default MVP token

        // --- WebSocket Logic ---
        ws.onopen = () => {
            document.getElementById('status-dot').classList.add('online');
            document.getElementById('status-text').innerText = "Online";
        };

        ws.onclose = () => {
            document.getElementById('status-dot').classList.remove('online');
            document.getElementById('status-text').innerText = "Offline";
        };

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            if (msg.type === 'state_update' && msg.data.system_stats) {
                document.getElementById('cpu').innerText = msg.data.system_stats.cpu_percent + "%";
                document.getElementById('mem').innerText = msg.data.system_stats.memory_percent + "%";
            }
            // We could also stream logs here if desired
        };

        // --- Chat Logic ---
        const chatWindow = document.getElementById('chat-window');
        const input = document.getElementById('msg-input');

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage("You", text, "user");
            input.value = "";

            try {
                // Haptic feedback
                if (navigator.vibrate) navigator.vibrate(10);

                const res = await fetch('/api/chat?token=' + token, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: text})
                });
                const data = await res.json();

                // Haptic feedback on receive
                if (navigator.vibrate) navigator.vibrate([10, 30, 10]);

                addMessage("My Son", data.response, "agent");
            } catch (e) {
                addMessage("System", "Error: " + e, "agent");
            }
        }

        function addMessage(sender, text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = type === 'agent' ? `<strong>${sender}</strong>${formatText(text)}` : text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function formatText(text) {
            // Basic formatting for code blocks or newlines
            return text.replace(/\n/g, '<br>');
        }

        // --- Voice Logic (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                input.value = transcript;
                sendMessage();
            };

            recognition.onend = () => {
                document.getElementById('mic-btn').classList.remove('recording');
            };
        }

        function toggleVoice() {
            if (!recognition) {
                alert("Voice input not supported in this browser.");
                return;
            }
            const btn = document.getElementById('mic-btn');
            if (btn.classList.contains('recording')) {
                recognition.stop();
            } else {
                btn.classList.add('recording');
                recognition.start();
                if (navigator.vibrate) navigator.vibrate(50);
            }
        }
    </script>
</body>
</html>
