<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Son - Autonomous Agent Interface</title>
    <style>
        body { font-family: monospace; background-color: #1e1e1e; color: #00ff00; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .input-group { margin-bottom: 20px; }
        input[type="text"], input[type="password"] { width: 70%; padding: 10px; background: #333; color: white; border: 1px solid #555; }
        button { padding: 10px 20px; background: #008800; color: white; border: none; cursor: pointer; }
        button:hover { background: #00aa00; }
        #chat-log { height: 300px; overflow-y: scroll; border: 1px solid #555; padding: 10px; margin-bottom: 20px; background: #000; }
        .message { margin-bottom: 10px; }
        .user { color: #aaa; }
        .agent { color: #00ff00; font-weight: bold; }
        .controls { border-top: 1px solid #555; padding-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>My Son Interface</h1>

        <div class="input-group">
            <label>Auth Token: </label>
            <input type="password" id="auth-token" value="1234" placeholder="Enter Secret Token">
        </div>

        <div id="chat-log"></div>

        <div class="input-group">
            <input type="text" id="user-input" placeholder="Enter command or query...">
            <button onclick="sendMessage()">Send</button>
        </div>

        <div class="controls">
            <button onclick="downloadCode()">Download Source Code</button>
            <button onclick="triggerUpgrade()">Trigger Self-Improvement</button>
        </div>

        <div class="controls">
             <input type="text" id="action-cmd" placeholder="Shell Command (e.g. ls -la)">
             <button onclick="runAction()">Run Action</button>
        </div>
        <div id="action-output" style="white-space: pre-wrap; margin-top:10px;"></div>
    </div>

    <script>
        const chatLog = document.getElementById('chat-log');

        function getHeaders() {
            return {
                'Content-Type': 'application/json',
                'X-Auth-Token': document.getElementById('auth-token').value
            };
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value;
            if (!message) return;

            // Add user message to log
            chatLog.innerHTML += `<div class="message user">You: ${message}</div>`;
            input.value = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ message: message })
                });

                if (response.status === 401) {
                    chatLog.innerHTML += `<div class="message agent">Error: Unauthorized. Check Token.</div>`;
                    return;
                }

                const data = await response.json();
                chatLog.innerHTML += `<div class="message agent">Agent: ${data.response}</div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            } catch (e) {
                chatLog.innerHTML += `<div class="message agent">Error: ${e}</div>`;
            }
        }

        async function downloadCode() {
            const token = document.getElementById('auth-token').value;
            window.location.href = `/api/download?token=${token}`;
        }

        async function triggerUpgrade() {
            try {
                const response = await fetch('/api/upgrade', {
                    method: 'POST',
                    headers: getHeaders()
                });
                const data = await response.json();
                alert(data.status);
            } catch (e) {
                alert("Error triggering upgrade: " + e);
            }
        }

        async function runAction() {
            const cmd = document.getElementById('action-cmd').value;
            try {
                const response = await fetch('/api/action', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ command: cmd })
                });
                const data = await response.json();
                document.getElementById('action-output').innerText =
                    `Stdout: ${data.stdout}\nStderr: ${data.stderr}\nCode: ${data.returncode}`;
            } catch (e) {
                alert("Error running action: " + e);
            }
        }
    </script>
</body>
</html>
